<!DOCTYPE html>
<html data-app="hangar">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('eve_suite_theme')||'default';}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVE Fitting Hangar</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* ---- structural wireframe only; colour/font identity lives in themes.css ---- */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-size:14px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50}
.diamond{width:7px;height:7px;display:inline-block;vertical-align:middle}
.backlink{font-size:10px;padding:7px 12px;display:none;align-items:center;white-space:nowrap}
.eveclock{font-size:12px;white-space:nowrap;padding:5px 10px}
.pilots{display:flex;flex-wrap:wrap;gap:6px}
.ptag{font-size:10px;padding:4px 10px;cursor:pointer}
.nochars{font-size:10px}
.empty{padding:44px 20px;text-align:center;font-size:12.5px;line-height:1.8}
.charerr{padding:8px 12px;font-size:10.5px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:11.5px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#toast.show{opacity:1}
.spin{width:15px;height:15px;display:inline-block;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}

.bays{max-width:1380px;margin:0 auto;padding:26px 34px 70px;position:relative;z-index:1}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:16px}
.tb-left{display:flex;align-items:flex-start;gap:16px}
.kicker{font-size:10px;margin-bottom:7px}
h1{font-size:25px;margin:0}
h1 .diamond{margin:0 10px;transform:translateY(-2px)}
.subline{font-size:12px;margin-top:6px;max-width:640px}
.tb-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.ctl{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.ctl .btn{font-size:10.5px;padding:8px 16px;cursor:pointer}
.ctl .hint{font-size:10.5px}
/* hangar bays: one wide horizontal bay per hull, fits as chips inside */
.bay{margin-bottom:14px;position:relative}
.bay-hd{display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer}
.bay-hd .hull{font-size:13.5px}
.bay-hd .cnt{font-size:10px}
.bay-hd .grip{flex:1;height:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 14px}
.fitchip{font-size:11px;padding:6px 12px;cursor:pointer}
/* opened fit: three-column slot board */
.board{padding:4px 18px 16px;display:none}
.board.open{display:block}
.board .bh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.board .bh .fn{font-size:12.5px}
.board .bh .btn{font-size:9.5px;padding:5px 11px;cursor:pointer}
.slotcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.scol .sh{font-size:9px;padding-bottom:5px;margin-bottom:7px}
.mod{font-size:11px;padding:4px 0;display:flex;justify-content:space-between;gap:8px}
.mod .mq{flex:none;font-size:10px}

</style>
<link rel="stylesheet" href="themes.css">
<script src="themes.js" defer></script>
</head>
<body>

<div class="bays">
<header class="topbar">
  <div class="tb-left">
    <a class="backlink" id="backlink" href="index.html">◂ Toolset</a>
    <div>
      <div class="kicker">In-Game Fittings · All Pilots</div>
      <h1>Fitting<span class="diamond"></span>Hangar</h1>
      <div class="subline">Every fitting saved in game, racked into bays by hull — open a fit to see its slot board and copy it out as EFT. Rebuilt anew from the Fit Manager.</div>
    </div>
  </div>
  <div class="tb-right">
    <span class="eveclock" id="eveclock"></span>
    <div class="pilots" id="pilots"></div>
  </div>
</header>
<div class="ctl">
  <button class="btn primary" id="loadBtn">Open the bays</button>
  <span class="hint" id="loadNote"></span>
</div>
<div id="out"><div class="empty">Press <b>Open the bays</b> to read every pilot's saved fittings.<br>Sign-in lives in the Toolset menu.</div></div>
</div>

<div id="toast"></div>
<script>
const MY_SECTION='hangar';

'use strict';
/* ================================================================== */
/* EVE Toolset shared runtime — consumes the SUITE-WIDE login only.   */
/* Sign-in happens exclusively in index.html. The SSO client id is    */
/* NOT embedded here: index.html publishes it to localStorage         */
/* (eve_suite_client_id) and this tool reads it for token refreshes.  */
/* No theme selector and no character portraits live in this file —   */
/* pilots appear as text tags only; icons belong to index.html.       */
/* ================================================================== */
function suiteClientId(){try{return localStorage.getItem('eve_suite_client_id')||'';}catch(e){return '';}}
const SHARED_KEY='eve_suite_chars';
const SECTION_KEY='eve_suite_char_sections';
const DASHBOARD_KEY='eve_suite_dashboard';
const ESI='https://esi.evetech.net/latest';
const SSO_TOKEN='https://login.eveonline.com/v2/oauth/token';
const now=()=>Date.now();
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadChars(){try{return JSON.parse(localStorage.getItem(SHARED_KEY)||'{}');}catch(e){return{};}}
let chars=loadChars();
function saveChars(){try{localStorage.setItem(SHARED_KEY,JSON.stringify(chars));}catch(e){}}
function sectionOn(id){try{const p=JSON.parse(localStorage.getItem(SECTION_KEY)||'{}')[id];return !p||p[MY_SECTION]!==false;}catch(e){return true;}}
function setSection(id,on){try{const a=JSON.parse(localStorage.getItem(SECTION_KEY)||'{}');a[id]=a[id]||{};a[id][MY_SECTION]=on;localStorage.setItem(SECTION_KEY,JSON.stringify(a));}catch(e){}}
function visibleIds(){return Object.keys(chars).filter(sectionOn);}
function toast(msg,bad){const t=$('toast');if(!t)return;t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(toast._t);toast._t=setTimeout(()=>{t.className='';},3600);}
function reportDashboard(text,level){try{const all=JSON.parse(localStorage.getItem(DASHBOARD_KEY)||'{}');all[MY_SECTION]={text,level,ts:Date.now()};localStorage.setItem(DASHBOARD_KEY,JSON.stringify(all));}catch(e){}}
function fmtISK(n){if(n==null||isNaN(n))return '—';const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e12)return s+(a/1e12).toFixed(2)+'T';if(a>=1e9)return s+(a/1e9).toFixed(2)+'B';
  if(a>=1e6)return s+(a/1e6).toFixed(2)+'M';if(a>=1e3)return s+(a/1e3).toFixed(1)+'K';return s+a.toFixed(a>0&&a<10?2:0);}
function fmtFull(n){if(n==null||isNaN(n))return '—';return Number(n).toLocaleString('en-US',{maximumFractionDigits:2});}
function fmtInt(n){return (n==null||isNaN(n))?'—':Number(n).toLocaleString('en-US');}
function timeago(ts){const m=(now()-ts)/60000;if(m<1)return 'just now';if(m<60)return Math.round(m)+'m ago';if(m<1440)return Math.round(m/60)+'h ago';return Math.round(m/1440)+'d ago';}
function fmtDur(ms){if(ms==null)return '—';if(ms<=0)return 'done';const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),mi=Math.floor(ms%3600000/60000);
  if(d>0)return d+'d '+h+'h';if(h>0)return h+'h '+mi+'m';return mi+'m';}
function roman(n){return ['0','I','II','III','IV','V'][n]||String(n);}
async function postToken(body){const r=await fetch(SSO_TOKEN,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  if(!r.ok){let d='';try{d=' '+(await r.text()).slice(0,120);}catch(e){}throw new Error('token HTTP '+r.status+d);}return r.json();}
async function refreshTok(id){const s=chars[id];if(!s||!s.refresh)throw new Error('no refresh token');
  const cid=suiteClientId();
  if(!cid)throw new Error('sign-in config not shared yet — open the Toolset menu (index.html) once');
  const tok=await postToken(new URLSearchParams({grant_type:'refresh_token',refresh_token:s.refresh,client_id:cid}).toString());
  const ns={...s,access:tok.access_token,refresh:tok.refresh_token||s.refresh,expires:now()+((tok.expires_in||1200)*1000)};
  chars[id]=ns;saveChars();return ns;}
async function getTok(id){const s=chars[id];if(!s)return null;if(s.expires>now()+60000)return s;
  try{return await refreshTok(id);}catch(e){return s.expires>now()?s:null;}}
async function esiFetch(path,opts){const o=opts||{};const h={};if(o.token)h.Authorization='Bearer '+o.token;
  if(o.body!==undefined)h['Content-Type']='application/json';
  const r=await fetch(ESI+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  if(!r.ok){const err=new Error('ESI '+r.status+' on '+path.split('?')[0]);err.status=r.status;throw err;}
  return {json:await r.json(),res:r};}
async function esiGet(path,token){return (await esiFetch(path,{token})).json;}
async function esiPost(path,body,token){return (await esiFetch(path,{method:'POST',body,token})).json;}
async function esiGetPaged(path,token,cap){const sep=path.includes('?')?'&':'?';
  const first=await esiFetch(path+sep+'page=1',{token});let out=first.json;
  const pages=Math.min(parseInt(first.res.headers.get('X-Pages')||'1',10),cap||10);
  for(let p=2;p<=pages;p++){try{out=out.concat((await esiFetch(path+sep+'page='+p,{token})).json);}catch(e){}}
  return out;}
function pLimit(n){let act=0;const q=[];
  const next=()=>{if(act>=n||!q.length)return;act++;const [fn,res,rej]=q.shift();
    Promise.resolve().then(fn).then(v=>{act--;res(v);next();},e=>{act--;rej(e);next();});};
  return fn=>new Promise((res,rej)=>{q.push([fn,res,rej]);next();});}
/* ---- persistent id→name cache (shared with the rest of the suite) ---- */
const NAME_CACHE_KEY='eve_suite_namecache_v1';
let nameCache={};try{nameCache=JSON.parse(localStorage.getItem(NAME_CACHE_KEY)||'{}');}catch(e){}
function saveNameCache(){try{const ks=Object.keys(nameCache);
  if(ks.length>9000)ks.slice(0,ks.length-8000).forEach(k=>delete nameCache[k]);
  localStorage.setItem(NAME_CACHE_KEY,JSON.stringify(nameCache));}catch(e){}}
async function _resolveChunk(chunk){try{const res=await esiPost('/universe/names/',chunk);
    res.forEach(r=>{nameCache[r.id]={n:r.name,c:r.category};});}
  catch(e){if(e.status===404&&chunk.length>1){const m=chunk.length>>1;
      await _resolveChunk(chunk.slice(0,m));await _resolveChunk(chunk.slice(m));}
    else if(e.status===404){nameCache[chunk[0]]={n:'#'+chunk[0],c:'unknown'};}}}
async function resolveNames(ids){const need=[...new Set(ids.filter(i=>i&&i<1e12&&!nameCache[i]))];
  for(let i=0;i<need.length;i+=900)await _resolveChunk(need.slice(i,i+900).map(Number));
  if(need.length)saveNameCache();
  const out={};ids.forEach(i=>{out[i]=nameCache[i]?nameCache[i].n:null;});return out;}
function nameOf(id,fb){return nameCache[id]?nameCache[id].n:(fb!==undefined?fb:('#'+id));}
async function structureName(id,token){if(nameCache[id])return nameCache[id].n;
  try{const s=await esiGet('/universe/structures/'+id+'/',token);
    nameCache[id]={n:s.name,c:'structure'};saveNameCache();return s.name;}
  catch(e){return 'Structure '+id;}}
async function locationName(id,token){if(id==null)return '—';
  if(id>=1e12)return structureName(id,token);
  await resolveNames([id]);return nameOf(id,'Location '+id);}
/* ---- persistent type-info cache (volume, group) ---- */
const TYPE_CACHE_KEY='eve_suite_typeinfo_v1';
let typeCache={};try{typeCache=JSON.parse(localStorage.getItem(TYPE_CACHE_KEY)||'{}');}catch(e){}
function saveTypeCache(){try{const ks=Object.keys(typeCache);
  if(ks.length>6000)ks.slice(0,ks.length-5000).forEach(k=>delete typeCache[k]);
  localStorage.setItem(TYPE_CACHE_KEY,JSON.stringify(typeCache));}catch(e){}}
const typeLimit=pLimit(6);
async function typeInfo(id){if(typeCache[id])return typeCache[id];
  const t=await typeLimit(()=>esiGet('/universe/types/'+id+'/'));
  typeCache[id]={name:t.name,volume:t.volume,pv:t.packaged_volume,gid:t.group_id};
  nameCache[id]={n:t.name,c:'inventory_type'};saveTypeCache();return typeCache[id];}
/* ---- pilot toggles: TEXT tags only — portraits/icons live in index.html ---- */
function renderPilots(){const el=$('pilots');if(!el)return;const ids=Object.keys(chars);
  if(!ids.length){el.innerHTML='<span class="nochars">no pilots — sign in from the Toolset menu</span>';return;}
  el.innerHTML=ids.map(id=>{const on=sectionOn(id);const c=chars[id];
    const t='click to '+(on?'exclude from':'include in')+' this tool';
    return '<button class="ptag'+(on?'':' off')+'" data-id="'+id+'" title="'+t+'">'+esc(c.charName||('Char '+id))+'</button>';}).join('');
  el.querySelectorAll('.ptag').forEach(b=>{b.onclick=()=>{const id=b.dataset.id;setSection(id,!sectionOn(id));renderPilots();if(window.onRosterChange)window.onRosterChange();};});}
window.addEventListener('storage',e=>{if(e.key===SHARED_KEY){chars=loadChars();renderPilots();if(window.onRosterChange)window.onRosterChange();}});
function tickClock(){const el=$('eveclock');if(!el)return;const d=new Date();
  el.textContent=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+' EVE';}
setInterval(tickClock,15000);tickClock();
try{if(window.self===window.top){const bl=$('backlink');if(bl)bl.style.display='inline-flex';}}catch(e){}
renderPilots();
function noPilotsGuard(containerId){const ids=visibleIds();const el=$(containerId);
  if(!Object.keys(chars).length){if(el)el.innerHTML='<div class="empty">No pilots signed in yet.<br><br>Open the EVE Toolset menu and add characters there — every tool shares that one sign-in.</div>';return true;}
  if(!ids.length){if(el)el.innerHTML='<div class="empty">All pilots are excluded from this tool.<br>Click a pilot name above to include one.</div>';return true;}
  return false;}


/* ================= Fitting Hangar ================= */
/* Standard dogma inventory flags for fitting sections. */
const FLAG_SECTIONS=[
  {name:'High slots', lo:27, hi:34},
  {name:'Mid slots',  lo:19, hi:26},
  {name:'Low slots',  lo:11, hi:18},
  {name:'Rigs',       lo:92, hi:99},
  {name:'Subsystems', lo:125,hi:132},
  {name:'Drone bay',  lo:87, hi:87},
  {name:'Cargo',      lo:5,  hi:5},
];
function sectionOf(flag){
  for(const s of FLAG_SECTIONS)if(flag>=s.lo&&flag<=s.hi)return s.name;
  return 'Other';
}
let bays=null;   // shipTypeId -> [{fit, owner}]

async function loadAll(){
  if(noPilotsGuard('out'))return;
  const btn=$('loadBtn');btn.disabled=true;
  $('out').innerHTML='<div class="empty"><span class="spin"></span>Opening the bays…</div>';
  bays={};const errs=[];
  for(const id of visibleIds()){
    try{
      const s=await getTok(id);
      if(!s)throw new Error('token expired — re-open the Toolset menu');
      const fits=await esiGet('/characters/'+id+'/fittings/',s.access);
      fits.forEach(f=>{bays[f.ship_type_id]=bays[f.ship_type_id]||[];bays[f.ship_type_id].push({fit:f,owner:s.charName||('Char '+id)});});
    }catch(e){errs.push(((chars[id]||{}).charName||id)+': '+(e.status===403?'fittings scope missing — re-add in the Toolset menu':e.message));}
  }
  const typeIds=Object.keys(bays).map(Number)
    .concat(Object.values(bays).flatMap(list=>list.flatMap(x=>x.fit.items.map(i=>i.type_id))));
  try{await resolveNames(typeIds);}catch(e){}
  render(errs);
  btn.disabled=false;
}

function eftOf(entry){
  const f=entry.fit;
  const bySec={};
  f.items.forEach(i=>{const s=sectionOf(i.flag);bySec[s]=bySec[s]||[];bySec[s].push(i);});
  let out='['+nameOf(f.ship_type_id,'Ship')+', '+f.name+']\n';
  ['Low slots','Mid slots','High slots','Rigs','Subsystems'].forEach(sec=>{
    (bySec[sec]||[]).forEach(i=>{for(let k=0;k<(i.quantity||1);k++)out+=nameOf(i.type_id,'Module')+'\n';});
    if(bySec[sec]&&bySec[sec].length)out+='\n';
  });
  ['Drone bay','Cargo','Other'].forEach(sec=>{
    (bySec[sec]||[]).forEach(i=>{out+=nameOf(i.type_id,'Item')+' x'+(i.quantity||1)+'\n';});
  });
  return out.trim();
}

function render(errs){
  const errHtml=(errs||[]).map(e=>'<div class="charerr">⚠ '+esc(e)+'</div>').join('');
  const hulls=Object.keys(bays);
  if(!hulls.length){$('out').innerHTML=errHtml+'<div class="empty">no saved fittings on the roster</div>';return;}
  hulls.sort((a,b)=>String(nameOf(+a,'')).localeCompare(String(nameOf(+b,''))));
  let totalFits=0;
  $('out').innerHTML=errHtml+hulls.map(h=>{
    const list=bays[h];totalFits+=list.length;
    return '<div class="bay panel" data-hull="'+h+'">'+
      '<div class="bay-hd"><span class="hull">'+esc(nameOf(+h,'Hull '+h))+'</span><span class="grip"></span><span class="cnt">'+list.length+' fit'+(list.length>1?'s':'')+'</span></div>'+
      '<div class="chips">'+list.map((x,i)=>'<button class="fitchip" data-hull="'+h+'" data-i="'+i+'">'+esc(x.fit.name)+' <span style="opacity:.6">· '+esc(x.owner)+'</span></button>').join('')+'</div>'+
      '<div class="board" id="board-'+h+'"></div></div>';
  }).join('');
  document.querySelectorAll('.fitchip').forEach(ch=>{ch.onclick=()=>openFit(ch.dataset.hull,+ch.dataset.i);});
  reportDashboard(totalFits+' fits across '+hulls.length+' hulls','ok');
  $('loadNote').textContent='Bays read '+new Date().toUTCString().slice(17,25)+' EVE';
}

function openFit(hull,i){
  const entry=bays[hull][i];const f=entry.fit;
  const board=$('board-'+hull);
  const already=board.classList.contains('open')&&board.dataset.i===String(i);
  document.querySelectorAll('.board').forEach(b=>b.classList.remove('open'));
  if(already)return;
  const bySec={};
  f.items.forEach(it=>{const s=sectionOf(it.flag);bySec[s]=bySec[s]||[];bySec[s].push(it);});
  board.dataset.i=String(i);
  board.innerHTML='<div class="bh"><span class="fn">'+esc(f.name)+' — '+esc(entry.owner)+(f.description?' · '+esc(f.description):'')+'</span>'+
    '<button class="btn" id="eftBtn-'+hull+'">Copy as EFT</button></div>'+
    '<div class="slotcols">'+FLAG_SECTIONS.concat([{name:'Other'}]).filter(s=>bySec[s.name]&&bySec[s.name].length).map(s=>
      '<div class="scol"><div class="sh">'+s.name.toUpperCase()+'</div>'+
      bySec[s.name].map(it=>'<div class="mod"><span>'+esc(nameOf(it.type_id,'Type '+it.type_id))+'</span><span class="mq">×'+(it.quantity||1)+'</span></div>').join('')+
      '</div>').join('')+'</div>';
  board.classList.add('open');
  $('eftBtn-'+hull).onclick=()=>{
    const txt=eftOf(entry);
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('EFT copied'),()=>toast('copy blocked — see console',true));
    else toast('clipboard unavailable',true);
  };
}
$('loadBtn').onclick=loadAll;
window.onRosterChange=()=>{ if(bays)loadAll(); };

</script>
<script>
(function(){
  function applySuiteTheme(name){
    if(!name)return;
    try{document.documentElement.dataset.theme=name;}catch(err){}
  }
  window.addEventListener('storage',function(e){
    if(e.key==='eve_suite_theme')applySuiteTheme(e.newValue);
  });
})();
</script>
</body>
</html>
